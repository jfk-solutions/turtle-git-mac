name: TurtleGitMac
configs:
  Debug: debug
  Release: release
  AppStore: release
options:
  bundleIdPrefix: org.turtlegit.macos
  deploymentTarget:
    macOS: '13.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '13.0'
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Release:
      ARCHS: 'arm64 x86_64'
      ONLY_ACTIVE_ARCH: NO
    AppStore:
      ARCHS: 'arm64 x86_64'
      ONLY_ACTIVE_ARCH: NO
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) TURTLEGIT_APP_STORE'
targets:
  TurtleGitWCRev:
    type: tool
    platform: macOS
    sources: [Sources/TurtleGitWCRev]
    dependencies:
      - target: TurtleGitCore
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.turtlegit.macos.wcrev
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/../Frameworks'
  TurtleGitGitAskpass:
    type: tool
    platform: macOS
    sources:
      - path: Sources/TurtleGitGitAskpass
      - path: Sources/TurtleGitCore/GitAskpassPrompt.swift
      - path: Sources/TurtleGitCore/GitSVNAuthenticationPrompt.swift
      - path: Sources/TurtleGitCore/GitRemoteAuthenticationPrompt.swift
      - path: Sources/TurtleGitMac/DocumentationCapture.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.turtlegit.macos.git-askpass
        SKIP_INSTALL: YES
  TurtleGitSSHAskpass:
    type: tool
    platform: macOS
    sources: [Sources/TurtleGitSSHAskpass]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.turtlegit.macos.ssh-askpass
        SKIP_INSTALL: YES
  TurtleGitSMTP:
    type: framework
    platform: macOS
    sources:
      - path: Sources/TurtleGitSMTP
        headerVisibility: public
    dependencies:
      - sdk: libcurl.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.turtlegit.macos.smtp
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  TurtleGitCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/TurtleGitCore
        excludes: [Resources]
      - path: Sources/TurtleGitCore/Resources/Icons
        type: folder
        buildPhase: resources
      - path: Sources/TurtleGitCore/Resources/Completion
        type: folder
        buildPhase: resources
      - path: Sources/TurtleGitCore/Resources/RegexFilter.ini
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.turtlegit.macos.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: Network.framework
      - sdk: Security.framework
      - target: TurtleGitSMTP
        embed: false
  TurtleGitCache:
    type: application
    platform: macOS
    sources: [Sources/TurtleGitCache]
    dependencies:
      - target: TurtleGitCore
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.turtlegit.macos.cache
        INFOPLIST_FILE: Configuration/Cache-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Cache.entitlements
        SKIP_INSTALL: YES
        ENABLE_DEBUG_DYLIB: NO
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/../../../../../Frameworks'
  TurtleGitMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/TurtleGitMac
        excludes: [Resources]
      - path: Sources/TurtleGitMac/Resources/TurtleGitHelp.help
        type: folder
        buildPhase: resources
      - path: Sources/TurtleGitMac/Resources/ApplicationAssets.xcassets
        buildPhase: resources
      - path: Sources/TurtleGitMac/Resources/Branding
        type: folder
        buildPhase: resources
      - path: Sources/TurtleGitMac/Resources/Branding/TurtleGitPatch.icns
        buildPhase: resources
      - path: Sources/TurtleGitMac/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Sources/TurtleGitMac/Resources/LocalizationCredits.txt
        buildPhase: resources
      - path: Sources/TurtleGitMac/Resources/LocalizationManifest.json
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
    dependencies:
      - sdk: SecurityInterface.framework
      - target: TurtleGitCore
        embed: true
      - target: TurtleGitSMTP
        embed: true
      - target: TurtleGitFinder
        embed: true
      - target: TurtleGitSSHAskpass
        embed: false
      - target: TurtleGitGitAskpass
        embed: false
      - target: TurtleGitCache
        embed: false
      - target: TurtleGitWCRev
        embed: false
    postBuildScripts:
      - name: Index bundled Mac help
        script: /usr/bin/python3 "$SRCROOT/scripts/index-help.py" "$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME"
        inputFiles: ["$(SRCROOT)/Sources/TurtleGitMac/Resources/TurtleGitHelp.help/Contents/Resources/manifest.json", "$(SRCROOT)/scripts/index-help.py"]
        outputFiles: ["$(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/TurtleGitHelp.help/Contents/Resources/en.lproj/TurtleGitHelp.helpindex"]
      - name: Embed working copy revision utility
        script: |
          /usr/bin/python3 "$SRCROOT/scripts/embed-wcrev.py" "$BUILT_PRODUCTS_DIR/TurtleGitWCRev" "$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME"
        basedOnDependencyAnalysis: false
      - name: Embed Finder cache service
        script: |
          /usr/bin/python3 "$SRCROOT/scripts/embed-cache-service.py" "$BUILT_PRODUCTS_DIR/TurtleGitCache.app" "$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME" "$SRCROOT/Configuration/org.turtlegit.macos.cache.plist"
        basedOnDependencyAnalysis: false
      - name: Embed and audit production runtimes
        script: |
          /usr/bin/python3 "$SRCROOT/scripts/embed-app-runtimes.py" "$BUILT_PRODUCTS_DIR" "$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME" "$DERIVED_FILE_DIR/runtime-embedding-debug.json"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.turtlegit.macos
        INFOPLIST_FILE: Configuration/App-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Configuration/App.entitlements
      configs:
        AppStore:
          CODE_SIGN_ENTITLEMENTS: Configuration/AppStore.entitlements
  TurtleGitFinder:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderSync
      - path: Sources/TurtleGitMac/Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - target: TurtleGitCore
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.turtlegit.macos.finder
        INFOPLIST_FILE: Configuration/Finder-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Finder.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/../../../../Frameworks'
schemes:
  TurtleGitMac:
    build:
      targets:
        TurtleGitMac: all
  TurtleGitAppStore:
    build:
      targets:
        TurtleGitMac: all
    run:
      config: AppStore
    archive:
      config: AppStore
