name: macOS
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  svn-runtime:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Record SVN runtime toolchain key
        id: svn-toolchain
        run: |
          /usr/bin/arch -x86_64 /usr/bin/true
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, subprocess
          data = subprocess.check_output(['xcrun', 'clang', '--version']) + subprocess.check_output(['xcrun', '--show-sdk-build-version']) + subprocess.check_output(['xcrun', '--show-sdk-path']) + subprocess.check_output(['xcrun', '--find', 'clang'])
          print('key=' + hashlib.sha256(data).hexdigest())
          PY
      # Intermediate build trees have their own exact key. Prompt-only edits
      # repack the payload while native component recipe stamps remain reusable.
      - name: Restore exact SVN native component work
        id: svn-work-cache
        uses: actions/cache/restore@v5
        with:
          path: build/git-svn-runtime/work
          key: svn-native-work-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.workspace }}-${{ steps.svn-toolchain.outputs.key }}-${{ hashFiles('Configuration/GitSVNRuntime.json', 'Configuration/GitRuntime.json', 'scripts/build-git-svn-runtime.py', 'scripts/pinned_download.py') }}
      - name: Capture git-svn runtime cache key
        id: git-svn-key
        run: python3 scripts/ci-runtime-cache-key.py git-svn --toolchain '${{ steps.svn-toolchain.outputs.key }}' --runner '${{ runner.os }}-${{ runner.arch }}' >> "$GITHUB_OUTPUT"
      - name: Restore exact git-svn runtime
        id: git-svn-cache
        uses: actions/cache/restore@v5
        with:
          path: build/git-svn-runtime/GitSVN
          key: ${{ steps.git-svn-key.outputs.key }}
      - name: Build pinned universal private Perl/Subversion runtime
        if: steps.git-svn-cache.outputs.cache-hit != 'true'
        run: python3 scripts/build-git-svn-runtime.py
      - name: Validate prepared or restored git-svn runtime
        run: python3 scripts/validate-git-svn-runtime.py build/git-svn-runtime/GitSVN --audit-only
      - name: Save validated git-svn runtime
        if: steps.git-svn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build/git-svn-runtime/GitSVN
          key: ${{ steps.git-svn-cache.outputs.cache-primary-key }}
      - name: Save SVN native component work after payload validation
        if: steps.git-svn-cache.outputs.cache-hit != 'true' && steps.svn-work-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build/git-svn-runtime/work
          key: ${{ steps.svn-work-cache.outputs.cache-primary-key }}
      - name: Preserve executable permissions and contained aliases
        run: tar -czf build/git-svn-runtime/GitSVN.tar.gz -C build/git-svn-runtime GitSVN
      - uses: actions/upload-artifact@v4
        with:
          name: universal-git-svn-runtime
          path: build/git-svn-runtime/GitSVN.tar.gz
  build-and-test:
    needs: svn-runtime
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Report toolchain and system Git used by integration tests
        id: toolchain
        run: |
          swift --version
          xcodebuild -version
          /usr/bin/git --version
          git --version
          {
            xcodebuild -version
            xcrun --show-sdk-build-version
            xcrun clang++ --version
            cmake --version
          } > "$RUNNER_TEMP/turtlegit-toolchain.txt"
          turtlegit_toolchain_fingerprint=$(shasum -a 256 "$RUNNER_TEMP/turtlegit-toolchain.txt" | awk '{print $1}')
          echo "fingerprint=$turtlegit_toolchain_fingerprint" >> "$GITHUB_OUTPUT"
      - name: Pinned inventory regression
        run: python3 scripts/check-inventory-pin.py
      - name: Pinned native translation labels
        run: |
          python3 scripts/test-localizations.py
          python3 scripts/build-localizations.py
      - name: Native reference group coverage contracts
        run: python3 scripts/test-native-reference-groups-contracts.py
      - name: Native receiver cache and process ownership contracts
        run: python3 scripts/test-native-receiver.py
      - name: Native Finder team namespace and agent embedding contracts
        run: python3 scripts/test-finder-group-identity.py
      - name: Runtime cache invalidation contracts
        run: python3 scripts/test-ci-runtime-caches.py
      - name: Capture editorconfig runtime cache key
        id: editorconfig-key
        run: python3 scripts/ci-runtime-cache-key.py editorconfig --toolchain '${{ steps.toolchain.outputs.fingerprint }}' --runner '${{ runner.os }}-${{ runner.arch }}' >> "$GITHUB_OUTPUT"
      - name: Restore exact editorconfig runtime
        id: editorconfig-cache
        uses: actions/cache/restore@v5
        with:
          path: build/editorconfig-runtime/EditorConfig
          key: ${{ steps.editorconfig-key.outputs.key }}
      - name: Build and verify pinned universal EditorConfig parser
        if: steps.editorconfig-cache.outputs.cache-hit != 'true'
        run: python3 scripts/build-editorconfig-runtime.py
      - name: Validate prepared or restored editorconfig runtime
        run: python3 scripts/validate-editorconfig-runtime.py build/editorconfig-runtime/EditorConfig
      - name: Save validated editorconfig runtime
        if: steps.editorconfig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build/editorconfig-runtime/EditorConfig
          key: ${{ steps.editorconfig-cache.outputs.cache-primary-key }}
      - name: Capture issue-regex runtime cache key
        id: issue-regex-key
        run: python3 scripts/ci-runtime-cache-key.py issue-regex --toolchain '${{ steps.toolchain.outputs.fingerprint }}' --runner '${{ runner.os }}-${{ runner.arch }}' >> "$GITHUB_OUTPUT"
      - name: Restore exact issue-regex runtime
        id: issue-regex-cache
        uses: actions/cache/restore@v5
        with:
          path: build/issue-regex-runtime/IssueRegex
          key: ${{ steps.issue-regex-key.outputs.key }}
      - name: Build and verify universal C++ issue matcher
        if: steps.issue-regex-cache.outputs.cache-hit != 'true'
        run: python3 scripts/build-issue-regex-runtime.py
      - name: Validate prepared or restored issue-regex runtime
        run: python3 scripts/validate-issue-regex-runtime.py build/issue-regex-runtime/IssueRegex
      - name: Save validated issue-regex runtime
        if: steps.issue-regex-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build/issue-regex-runtime/IssueRegex
          key: ${{ steps.issue-regex-cache.outputs.cache-primary-key }}
      - name: Capture lexilla runtime cache key
        id: lexilla-key
        run: python3 scripts/ci-runtime-cache-key.py lexilla --toolchain '${{ steps.toolchain.outputs.fingerprint }}' --runner '${{ runner.os }}-${{ runner.arch }}' >> "$GITHUB_OUTPUT"
      - name: Restore exact lexilla runtime
        id: lexilla-cache
        uses: actions/cache/restore@v5
        with:
          path: build/lexilla-runtime/Lexilla
          key: ${{ steps.lexilla-key.outputs.key }}
      - name: Build and verify universal C++ Lexilla helper
        if: steps.lexilla-cache.outputs.cache-hit != 'true'
        run: python3 scripts/build-lexilla-runtime.py
      - name: Lexilla ordinary and inherited sandbox signing contracts
        run: python3 scripts/test-lexilla-embedding.py
      - name: Validate prepared or restored lexilla runtime
        run: python3 scripts/validate-lexilla-runtime.py build/lexilla-runtime/Lexilla
      - name: Save validated lexilla runtime
        if: steps.lexilla-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build/lexilla-runtime/Lexilla
          key: ${{ steps.lexilla-cache.outputs.cache-primary-key }}
      - name: Restore exact graph runtime package
        id: graph-layout-cache
        uses: actions/cache/restore@v5
        with:
          path: build/graph-layout-runtime/GraphLayout
          key: graph-layout-v1-${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('scripts/pinned_download.py', 'LICENSE', 'Configuration/GraphLayoutRuntime.json', 'Sources/TurtleGitGraphLayout/main.cpp', 'scripts/build-graph-layout-runtime.py', 'scripts/validate-graph-layout-runtime.py', 'scripts/embed-graph-layout-runtime.py', 'scripts/runtime_bundle_layout.py', 'scripts/git_lfs_runtime.py') }}
      - name: Build and verify pinned universal Revision Graph layout engine
        if: steps.graph-layout-cache.outputs.cache-hit != 'true'
        run: python3 scripts/build-graph-layout-runtime.py
      - name: Validate graph runtime package before reuse or caching
        run: python3 scripts/validate-graph-layout-runtime.py build/graph-layout-runtime/GraphLayout
      - name: Verify Intel-host universal graph CPU baseline regression
        run: python3 scripts/test-graph-layout-cpu-baseline.py
      - name: Save verified graph runtime package
        if: steps.graph-layout-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build/graph-layout-runtime/GraphLayout
          key: ${{ steps.graph-layout-cache.outputs.cache-primary-key }}
      - name: Verify Revision Graph helper embedding and ad-hoc signing branches
        run: python3 scripts/test-graph-layout-embedding.py
      - name: Capture openssh runtime cache key
        id: openssh-key
        run: python3 scripts/ci-runtime-cache-key.py openssh --toolchain '${{ steps.toolchain.outputs.fingerprint }}' --runner '${{ runner.os }}-${{ runner.arch }}' >> "$GITHUB_OUTPUT"
      - name: Restore exact openssh runtime
        id: openssh-cache
        uses: actions/cache/restore@v5
        with:
          path: build/openssh-runtime/OpenSSH
          key: ${{ steps.openssh-key.outputs.key }}
      - name: Build and verify pinned universal OpenSSH helpers
        if: steps.openssh-cache.outputs.cache-hit != 'true'
        run: python3 scripts/build-openssh-runtime.py
      - name: Validate prepared or restored openssh runtime
        run: python3 scripts/validate-openssh-runtime.py build/openssh-runtime/OpenSSH
      - name: Save validated openssh runtime
        if: steps.openssh-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build/openssh-runtime/OpenSSH
          key: ${{ steps.openssh-cache.outputs.cache-primary-key }}
      - name: Capture putty runtime cache key
        id: putty-key
        run: python3 scripts/ci-runtime-cache-key.py putty --toolchain '${{ steps.toolchain.outputs.fingerprint }}' --runner '${{ runner.os }}-${{ runner.arch }}' >> "$GITHUB_OUTPUT"
      - name: Restore exact PuTTY key converter
        id: putty-cache
        uses: actions/cache/restore@v5
        with:
          path: build/putty-runtime/PuTTY
          key: ${{ steps.putty-key.outputs.key }}
      - name: Build pinned universal PuTTY key converter
        if: steps.putty-cache.outputs.cache-hit != 'true'
        run: python3 scripts/build-putty-runtime.py
      - name: Validate prepared or restored PuTTY runtime
        run: python3 scripts/validate-putty-runtime.py build/putty-runtime/PuTTY
      - name: Save validated putty runtime
        if: steps.putty-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build/putty-runtime/PuTTY
          key: ${{ steps.putty-cache.outputs.cache-primary-key }}
      - name: Verify OpenSSH embedding and both ad-hoc signing branches
        run: python3 scripts/test-openssh-embedding.py
      - uses: actions/download-artifact@v4
        with:
          name: universal-git-svn-runtime
          path: build/git-svn-runtime
      - name: Restore universal SVN payload
        run: tar -xzf build/git-svn-runtime/GitSVN.tar.gz -C build/git-svn-runtime
      - name: Capture git runtime cache key
        id: git-key
        run: python3 scripts/ci-runtime-cache-key.py git --toolchain '${{ steps.toolchain.outputs.fingerprint }}' --runner '${{ runner.os }}-${{ runner.arch }}' >> "$GITHUB_OUTPUT"
      - name: Restore exact git runtime
        id: git-cache
        uses: actions/cache/restore@v5
        with:
          path: build/git-runtime/Git
          key: ${{ steps.git-key.outputs.key }}
      - name: Build pinned universal Git runtime with source and licenses
        if: steps.git-cache.outputs.cache-hit != 'true'
        run: python3 scripts/build-git-runtime.py
      - name: Validate prepared or restored git runtime
        run: python3 scripts/validate-git-runtime.py build/git-runtime/Git --require-lfs --require-svn
      - name: Save validated git runtime
        if: steps.git-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build/git-runtime/Git
          key: ${{ steps.git-cache.outputs.cache-primary-key }}
      - name: Verify real local SVN workflows with the pinned Git
        run: python3 scripts/validate-git-svn-runtime.py build/git-svn-runtime/GitSVN --git build/git-runtime/Git/bin/git
      - name: Capture merge-diff runtime cache key
        id: merge-diff-key
        run: python3 scripts/ci-runtime-cache-key.py merge-diff --toolchain '${{ steps.toolchain.outputs.fingerprint }}' --runner '${{ runner.os }}-${{ runner.arch }}' >> "$GITHUB_OUTPUT"
      - name: Restore exact merge-diff runtime
        id: merge-diff-cache
        uses: actions/cache/restore@v5
        with:
          path: build/merge-diff-runtime/MergeDiff
          key: ${{ steps.merge-diff-key.outputs.key }}
      - name: Build universal Subversion merge adapter sharing the pinned runtime
        if: steps.merge-diff-cache.outputs.cache-hit != 'true'
        run: python3 scripts/build-merge-diff-runtime.py
      - name: Validate prepared or restored merge-diff runtime
        run: python3 scripts/validate-merge-diff-runtime.py build/merge-diff-runtime/MergeDiff
      - name: Save validated merge-diff runtime
        if: steps.merge-diff-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build/merge-diff-runtime/MergeDiff
          key: ${{ steps.merge-diff-cache.outputs.cache-primary-key }}
      - name: Verify per-slice Git and LFS macOS deployment targets
        run: python3 scripts/test-git-runtime-deployment.py --runtime build/git-runtime/Git
      - name: Pinned source download recovery checks
        run: python3 scripts/test-pinned-download.py
      - name: Runtime embedding cache integrity checks
        run: python3 scripts/test-runtime-embedding-cache.py
      - name: Dialog audit consistency
        run: |
          python3 scripts/test-dialog-coverage.py
          python3 scripts/reconcile-dialog-coverage.py --check
      - name: Application and embedded Finder extension
        run: >-
          xcodebuild -quiet -project TurtleGitMac.xcodeproj -scheme TurtleGitMac
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      # Run the unresolved hosted editor gate immediately after its app build.
      # Keep it once; a failing family should not wait behind the full Core run.
      - name: Moved blocks and wrapped editor navigation family
        run: python3 scripts/test-merge-wrapped-family.py
      - name: Retain failed wrapped editor stack samples
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wrapped-editor-timeout-stacks
          path: build/qa/native-timeouts/*.sample.txt
          if-no-files-found: ignore
      - name: Pinned moved-block detector oracle
        run: python3 scripts/test-moved-block-source.py
      - name: Git integration tests
        env:
          # Rebase tests invoke the real app's headless editor entry point.
          # Core-only SwiftPM deliberately does not build .build/debug/TurtleGitMac.
          TURTLEGIT_REBASE_EDITOR: ${{ github.workspace }}/build/Build/Products/Debug/TurtleGitMac.app/Contents/MacOS/TurtleGitMac
        run: TURTLEGIT_CORE_ONLY=1 swift test
      - name: Pinned inline parser and matching oracle
        run: python3 scripts/test-inline-source.py
      - name: Shared message styles and spelling
        run: python3 scripts/test-message-style-family.py --only styles --only spelling --only font --only links --git /usr/bin/git --git "$PWD/build/git-runtime/Git/bin/git"
      - name: Log rich message links and owned styling
        run: python3 scripts/test-log-message-family.py --git /usr/bin/git --git "$PWD/build/git-runtime/Git/bin/git"
      - name: Add LFS and persistent native list family
        run: python3 scripts/test-add-list-family.py --git /usr/bin/git --git "$PWD/build/git-runtime/Git/bin/git"
      - name: Native file selection and Log workflows
        run: |
          python3 scripts/test-commit-command-family.py --only identities --git /usr/bin/git --git "$PWD/build/git-runtime/Git/bin/git"
          python3 scripts/test-add-revert-identities.py --git /usr/bin/git --git "$PWD/build/git-runtime/Git/bin/git"
          python3 scripts/test-add-revert-file-flow.py --git /usr/bin/git --git "$PWD/build/git-runtime/Git/bin/git"
          python3 scripts/test-log-file-identities.py --git /usr/bin/git --git "$PWD/build/git-runtime/Git/bin/git"
          python3 scripts/test-log-controls-layout.py --git /usr/bin/git --git "$PWD/build/git-runtime/Git/bin/git"
          python3 scripts/test-comparison-workflow.py --git /usr/bin/git --git "$PWD/build/git-runtime/Git/bin/git"
          python3 scripts/test-file-transfer-family.py --only identities --git /usr/bin/git --git "$PWD/build/git-runtime/Git/bin/git"
          python3 scripts/test-workspace-files.py --only workspace --git /usr/bin/git --git "$PWD/build/git-runtime/Git/bin/git"
      - name: LFS exact paths, owner columns and captured progress
        run: python3 scripts/test-lfs-path-family.py --git /usr/bin/git --git "$PWD/build/git-runtime/Git/bin/git"
      - name: Bundled Mac help and contextual dispatch
        run: python3 scripts/test-help-book.py
      - name: Hierarchical settings operation ownership
        run: python3 scripts/test-configuration-lifecycle.py --git /usr/bin/git --git "$PWD/build/git-runtime/Git/bin/git"
      - name: Repository titles and native file tooltips
        run: python3 scripts/test-repository-presentation.py --git /usr/bin/git
      - name: SVN source forms and captured workflow actions
        run: python3 scripts/test-svn-source-family.py --source-only --git /usr/bin/git --git "$PWD/build/git-runtime/Git/bin/git"
      - name: First Start forms and setup operation ownership
        run: python3 scripts/test-first-start-family.py --git /usr/bin/git --git "$PWD/build/git-runtime/Git/bin/git"
      - name: Finder overlay and watched-repository source controls
        run: python3 scripts/test-finder-control-source-family.py --git /usr/bin/git --git "$PWD/build/git-runtime/Git/bin/git"
      - name: Project dialog source forms and owned icon chooser
        run: python3 scripts/test-project-dialog-source-family.py --git /usr/bin/git --git "$PWD/build/git-runtime/Git/bin/git"
      - name: Distribution source and bundle provenance
        run: python3 scripts/test-distribution-provenance.py
      - name: Native Apple support report review and export
        run: python3 scripts/test-support-report-family.py
      - name: Pinned About banner water-effect oracle
        run: python3 scripts/test-about-water-source.py
      - name: Source About variants and selected Git lifetime
        run: python3 scripts/test-about-source-family.py --git /usr/bin/git --git "$PWD/build/git-runtime/Git/bin/git"
      - name: Pinned Scintilla Unicode Find mappings
        run: python3 scripts/generate-unified-case-fold.py --check
      - name: Shared standalone and attached source Find controls
        run: python3 scripts/test-unified-find-family.py --only source --git /usr/bin/git --git "$PWD/build/git-runtime/Git/bin/git"
      - name: External document tool arguments and scoped lifetime
        run: python3 scripts/test-external-document-family.py
      - name: Unified Diff editable document workflows
        run: python3 scripts/test-unified-document-family.py --only document --only handoffs --git /usr/bin/git --git "$PWD/build/git-runtime/Git/bin/git"
      - name: Git Properties live parent pages and scoped ownership
        run: python3 scripts/test-git-properties-family.py --only parents --git /usr/bin/git --git "$PWD/build/git-runtime/Git/bin/git"
      - name: Image native command family
        run: python3 scripts/test-image-command-family.py --git /usr/bin/git --git "$PWD/build/git-runtime/Git/bin/git"
      - name: LibreOffice comparison and tracked-change merge owners
        run: python3 scripts/test-libreoffice-family.py --git /usr/bin/git --git "$PWD/build/git-runtime/Git/bin/git"
      - name: Scoped native Merge menus and pane shortcuts
        run: python3 scripts/test-merge-view-family.py --only typing --only lifecycle --only menus
      - name: Merge view switching, native chrome and saved splits
        run: python3 scripts/test-merge-view-family.py --only view --git /usr/bin/git --git "$PWD/build/git-runtime/Git/bin/git"
      - name: Inline engine native consumers
        run: python3 scripts/test-inline-native.py
      - name: Working copy revision utility and upstream templates
        run: python3 scripts/test-wcrev.py --tool .build/debug/TurtleGitWCRev --git /usr/bin/git --git build/git-runtime/Git/bin/git
      - name: SVN command compatibility with pinned Git
        env:
          TURTLEGIT_SVN_TEST_GIT: ${{ github.workspace }}/build/git-runtime/Git/bin/git
        run: TURTLEGIT_CORE_ONLY=1 swift test --skip-build --filter GitSVNTests
      - name: Native historical file and folder item-provider receivers
        run: scripts/verify-browser-item-provider.sh
      - name: Independent cache menu and activity ownership
        run: python3 scripts/test-cache-tray.py
      - name: Verify app, extension and original icon resources
        run: |
          python3 scripts/validate-app-bundle.py build/Build/Products/Debug/TurtleGitMac.app
          python3 scripts/audit-cache-service.py build/Build/Products/Debug/TurtleGitMac.app
      - name: Universal application architecture audit regression
        run: python3 scripts/test-bundle-architectures.py
      - name: Distribution archive identity and offline export contracts
        run: python3 scripts/test-distribution-archive.py
      - name: Preview signing inventory regression
        run: python3 scripts/test-preview-signing.py
      - name: Verify production ad-hoc app seal and runtime links
        run: |
          python3 scripts/create-demo-repository.py "$RUNNER_TEMP/runtime-layout-repository"
          python3 scripts/create-preview-app.py build/Build/Products/Debug/TurtleGitMac.app \
            'build/qa/runtime-layout-signed-2026-10-13/TurtleGit Layout QA.app' \
            --repository "$RUNNER_TEMP/runtime-layout-repository" \
            --bundle-identifier org.turtlegit.macos.documentation-preview.layout-ci
          python3 docs/qa/runtime-layout-native-2026-10-13.py \
            'build/qa/runtime-layout-signed-2026-10-13/TurtleGit Layout QA.app'
      - name: Verify embedded Subversion merge adapter and shared libraries
        run: python3 scripts/test-merge-diff-bundle.py build/Build/Products/Debug/TurtleGitMac.app
      - name: Grouped native LFS and Send Mail receivers with one compilation
        run: python3 scripts/test-native-lfs-mail-batch.py
      - name: Native Send Mail source forms and owned target preparation
        run: >-
          python3 scripts/test-send-source-family.py --only source
          --git /usr/bin/git
          --git build/Build/Products/Debug/TurtleGitMac.app/Contents/Helpers/Git/bin/git
      - name: Native Branch and Tag source forms and connected workflows
        run: python3 scripts/test-branch-tag-source.py --git /usr/bin/git --git build/git-runtime/Git/bin/git
      - name: Switch source form and connected workflows
        run: python3 scripts/test-switch-source.py --git /usr/bin/git --git build/git-runtime/Git/bin/git
      - name: Source transport forms and connected workflows
        run: python3 scripts/test-transport-source.py --git /usr/bin/git --git build/git-runtime/Git/bin/git
      - name: Rebase source forms and connected workflows
        run: python3 scripts/test-rebase-source.py --git /usr/bin/git --git build/Build/Products/Debug/TurtleGitMac.app/Contents/Resources/TurtleGitRuntimes/Git/bin/git
      - name: Native Issue Tracker source and Regex Tester workflows
        run: python3 scripts/test-issue-tracker-source.py --git /usr/bin/git --git build/git-runtime/Git/bin/git
      - name: Native release download and App Store workflows
        run: python3 scripts/test-release-updates.py
      - name: Native regex source list and editor workflows
        run: python3 scripts/test-merge-regex-source.py
      - name: Native Encoding source sheet and editor transactions
        run: python3 scripts/test-merge-format-source.py
      - name: Native revision and prompt word-command consumers
        run: python3 scripts/test-input-word-consumers.py --git /usr/bin/git --git build/git-runtime/Git/bin/git
      - name: Native URL and path input word commands
        run: python3 scripts/test-input-word-navigation.py --git /usr/bin/git --git build/git-runtime/Git/bin/git
      - name: Native prefixed command and progress failure diagnostics
        run: python3 scripts/test-progress-diagnostic-family.py --git /usr/bin/git --git build/git-runtime/Git/bin/git
      - name: Native Daemon progress and owned loopback lifecycle
        run: python3 scripts/test-daemon-progress-family.py --git /usr/bin/git --git build/git-runtime/Git/bin/git
      - name: Native byte-backed unified diff editing Save and Undo
        run: python3 scripts/test-unified-byte-buffer.py --git /usr/bin/git --git build/git-runtime/Git/bin/git
      - name: Native exact patch rename recovery and import provider paths
