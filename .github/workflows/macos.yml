        run: python3 scripts/test-native-menu-images.py
      - name: Finder first-use registration and completed Clone watch ownership
        run: python3 scripts/test-finder-registration.py
      - name: Patch mail preparation with packaged Git
        run: TURTLEGIT_SEND_PATCH_TEST_GIT="$PWD/build/git-runtime/Git/bin/git" TURTLEGIT_CORE_ONLY=1 swift test --filter PatchMail
      - name: Build and audit unsigned universal App Store candidate
        run: python3 scripts/build-distribution.py --configuration AppStore --derived-data build-store
      - name: Preserve unsigned distribution audit
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-appstore-distribution-audit
          path: build-store/distribution-audit.json
      - name: Revision Graph through built Debug and Store frameworks and helpers
        run: python3 scripts/test-graph-layout-bundles.py
      - name: Revision Graph data and geometry with bundled Git
        run: TURTLEGIT_GROUP_TEST_GIT="$PWD/build/git-runtime/Git/bin/git" TURTLEGIT_CORE_ONLY=1 swift test --filter 'RevisionGraphLayoutTests|RevisionGraphTests|HistoryRangeTests'
      - name: Native Revision Graph window and Filter with both Git engines
        run: python3 scripts/test-revision-graph-window.py --git /usr/bin/git --git build/git-runtime/Git/bin/git
      - name: Revision Graph source save filters and hidden command ownership
        run: python3 scripts/test-revision-graph-save-family.py --git /usr/bin/git --git build/git-runtime/Git/bin/git
      - name: Native packaged Git SSH client lookup without network
        run: python3 scripts/test-git-ssh-runtime.py
      - name: Native AppStore bundled SSH encrypted-key loading and cleanup
        run: python3 scripts/test-bundled-ssh-agent.py
      - name: Build isolated older Git runtimes for replay tests
        run: |
          python3 scripts/build-replay-test-git.py --version 2.37.1
          python3 scripts/build-replay-test-git.py --version 2.39.5
      - name: Native Cherry Pick and Rebase recovery across Git versions
        run: >-
          python3 scripts/check-cherry-pick-native.py
          --git /usr/bin/git
          --git build/replay-test-git/2.37.1/bin/git
          --git build/replay-test-git/2.39.5/bin/git
          --git build-store/Build/Products/AppStore/TurtleGitMac.app/Contents/Helpers/Git/bin/git
