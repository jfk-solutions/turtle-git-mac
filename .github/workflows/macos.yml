name: macOS
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Git integration tests
        run: swift test
      - name: Application and embedded Finder extension
        run: >-
          xcodebuild -quiet -project TurtleGitMac.xcodeproj -scheme TurtleGitMac
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Verify app, extension and original icon resources
        run: python3 scripts/validate-app-bundle.py build/Build/Products/Debug/TurtleGitMac.app
      - name: Sandboxed App Store configuration (unsigned compilation)
        run: >-
          xcodebuild -quiet -project TurtleGitMac.xcodeproj -scheme TurtleGitAppStore
          -configuration AppStore -destination 'platform=macOS'
          -derivedDataPath build-store CODE_SIGNING_ALLOWED=NO build
      - name: Verify sandboxed app resources
        run: python3 scripts/validate-app-bundle.py build-store/Build/Products/AppStore/TurtleGitMac.app
