name: macOS
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Report toolchain and system Git used by integration tests
        run: |
          swift --version
          xcodebuild -version
          /usr/bin/git --version
          git --version
      - name: Pinned inventory regression
        run: python3 scripts/check-inventory-pin.py
      - name: Build and verify pinned universal EditorConfig parser
        run: python3 scripts/build-editorconfig-runtime.py
      - name: Build and verify universal C++ issue matcher
        run: python3 scripts/build-issue-regex-runtime.py
      - name: Git integration tests
        run: swift test
      - name: Native historical file and folder item-provider receivers
        run: scripts/verify-browser-item-provider.sh
      - name: Application and embedded Finder extension
        run: >-
          xcodebuild -quiet -project TurtleGitMac.xcodeproj -scheme TurtleGitMac
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Verify app, extension and original icon resources
        run: python3 scripts/validate-app-bundle.py build/Build/Products/Debug/TurtleGitMac.app
      - name: Native worktree dialog models and Git integration
        run: python3 scripts/test-worktree-dialog.py
      - name: Native RefLog browser, branch, tag and export handoffs
        run: python3 scripts/test-reflog-revision-handoffs.py
      - name: Native RefLog working-tree and selected revision comparisons
        run: python3 scripts/test-reflog-comparisons.py
      - name: Native RefLog forward, reverse and symmetric Log ranges
        run: python3 scripts/test-reflog-ranges.py
      - name: Native RefLog merge and two-revision unified diffs
        run: python3 scripts/test-reflog-unified-diff.py
      - name: Native RefLog previous revision and merge parent comparisons
        run: python3 scripts/test-reflog-parent-comparisons.py
      - name: Native RefLog Switch and Reset revision handoffs
        run: python3 scripts/test-reflog-history-actions.py
      - name: Native RefLog remote Switch defaults
        run: python3 scripts/test-reflog-remote-defaults.py
      - name: Native RefLog express branch switching
        run: python3 scripts/test-reflog-express-switch.py
      - name: Native Stash Apply and Pop result handoffs
        run: python3 scripts/test-stash-restore.py
      - name: Native Stash Save progress and post-actions
        run: python3 scripts/test-stash-save-progress.py
      - name: Native Merge progress and recovery post-actions
        run: python3 scripts/test-merge-progress.py
      - name: Native Merge conflict hint and suppression
        run: python3 scripts/test-merge-conflict-hint.py
      - name: Native Pull progress and Stash follow-ups
        run: python3 scripts/test-pull-progress.py
      - name: Native Clean progress policies and cancellation
        run: python3 scripts/test-clean-progress-policy.py
      - name: Native Reset retained progress and follow-ups
        run: python3 scripts/test-reset-progress.py
      - name: Native Push partial result refresh
        run: python3 scripts/test-push-result-refresh.py
      - name: Native Push retained progress and post-actions
        run: python3 scripts/test-push-progress.py
      - name: Native Request Pull generation and cancellation
        run: python3 scripts/test-request-pull.py
      - name: Native branch revision number display
        run: python3 scripts/test-branch-revision-number.py
      - name: Native Git progress automatic close policies
        run: python3 scripts/test-progress-auto-close.py
      - name: Native remembered Commit button actions
        run: python3 scripts/test-commit-last-action.py
      - name: Native Commit progress and hook cancellation
        run: python3 scripts/test-commit-progress.py
      - name: Native Fetch/Rebase decisions and fast-forward merge
        run: python3 scripts/test-fetch-rebase-decisions.py
      - name: Native ordinary Fetch progress and post-actions
        run: python3 scripts/test-fetch-progress.py
      - name: Native Abort Merge choices and Cancel routing
        run: python3 scripts/test-merge-abort-dialog.py
      - name: Native RefLog partial failures and continued deletion
        run: python3 scripts/test-reflog-partial-failure.py
      - name: Native general RefLog deletion and stale snapshot guards
        run: python3 scripts/test-reflog-deletion.py
      - name: Native RefLog revision navigation and clipboard
        run: python3 scripts/test-reflog-actions.py
      - name: Native RefLog modeless Find and function keys
        run: python3 scripts/test-reflog-search.py
      - name: Native Push Log and RefLog source selection
        run: python3 scripts/test-push-source-pickers.py
      - name: Native editable history deletion
        run: python3 scripts/test-history-deletion.py
      - name: Native Push preferences and confirmations
        run: python3 scripts/test-push-preferences.py
      - name: Native Push history and clipboard
        run: python3 scripts/test-push-history.py
      - name: Native Push cancellation
        run: python3 scripts/test-push-cancellation.py
      - name: Native Pull and Fetch cancellation
        run: python3 scripts/test-fetch-cancellation.py
      - name: Native Pull and Fetch clipboard input
        run: python3 scripts/test-fetch-clipboard.py
      - name: Native Pull and Fetch submodule defaults
        run: python3 scripts/test-fetch-submodule-defaults.py
      - name: Native Pull and Fetch history
        run: python3 scripts/test-fetch-history.py
      - name: Native Commit conflict-hint preflight
        run: python3 scripts/test-commit-conflict-hints.py
      - name: Native Commit and Rebase encoding receiver
        run: python3 scripts/test-commit-message-encoding.py
      - name: Native Commit and Rebase message-file receiver
        run: python3 scripts/test-commit-message-file.py
      - name: Native Commit settings and selection receiver
        run: python3 scripts/test-commit-selection-settings.py
      - name: Native Commit dirty-submodule workflow receiver
        run: python3 scripts/test-commit-dirty-submodule.py
      - name: Native Log double-click preference receiver
        run: python3 scripts/test-log-double-click.py
      - name: Native Log compressed graph rollup receiver
        run: python3 scripts/test-log-rollup.py
      - name: Native Log Gravatar mock transport receiver
        run: python3 scripts/test-log-gravatar.py
      - name: Native Statistics options and calculation receiver
        run: python3 scripts/test-statistics-dialog.py
      - name: Native Clean options and cleanup receiver
        run: python3 scripts/test-clean-dialog.py
      - name: Native Advanced Settings model and table receiver
        run: python3 scripts/test-advanced-settings.py
      - name: Native Add model and table receiver
        run: python3 scripts/test-add-dialog.py
      - name: Native Finder menu builder without extension activation
        run: python3 scripts/test-finder-menu.py
      - name: Build pinned universal Git runtime with source and licenses
        run: python3 scripts/build-git-runtime.py
      - name: Sandboxed App Store configuration (unsigned compilation)
        run: >-
          xcodebuild -quiet -project TurtleGitMac.xcodeproj -scheme TurtleGitAppStore
          -configuration AppStore -destination 'platform=macOS'
          -derivedDataPath build-store CODE_SIGNING_ALLOWED=NO build
      - name: Verify sandboxed app resources
        run: python3 scripts/validate-app-bundle.py build-store/Build/Products/AppStore/TurtleGitMac.app --require-git
      - name: Build isolated older Git runtimes for replay tests
        run: |
          python3 scripts/build-replay-test-git.py --version 2.37.1
          python3 scripts/build-replay-test-git.py --version 2.39.5
      - name: Native Cherry Pick and Rebase recovery across Git versions
        run: >-
          python3 scripts/check-cherry-pick-native.py
          --git /usr/bin/git
          --git build/replay-test-git/2.37.1/bin/git
          --git build/replay-test-git/2.39.5/bin/git
          --git build-store/Build/Products/AppStore/TurtleGitMac.app/Contents/Helpers/Git/bin/git
