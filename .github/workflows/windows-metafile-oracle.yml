name: Windows metafile reference
on:
  push:
    branches: [codex/metafile-rendering-oracle]
permissions:
  contents: read
jobs:
  reference:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run PolyTextOut missing-DX pointer reference
        shell: powershell
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Windows C++ toolchain missing" }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $compile = "@echo off`r`ncall `"$vcvars`"`r`nif errorlevel 1 exit /b 1`r`ncl /nologo /EHsc /std:c++17 scripts\oracles\CompactTextReference.cpp /Fe:CompactTextReference.exe /link gdiplus.lib gdi32.lib user32.lib usp10.lib`r`n"
          Set-Content -Path oracle-build.cmd -Value $compile -Encoding Ascii
          cmd /c oracle-build.cmd
          if ($LASTEXITCODE -ne 0) { throw "Reference compile failed" }
          .\CompactTextReference.exe scripts/oracles/compact-text-followup-inputs oracle-output
          if ($LASTEXITCODE -ne 0) { throw "Reference execution failed" }
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber
          Get-FileHash scripts/oracles/CompactTextReference.cpp -Algorithm SHA256
          Get-FileHash scripts/oracles/compact-text-followup-inputs/*.emf -Algorithm SHA256 | Format-Table -AutoSize
          Get-FileHash oracle-output/*.emf -Algorithm SHA256 | ConvertTo-Json | Set-Content oracle-output/generated-emf-hashes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-metafile-reference
          path: oracle-output
