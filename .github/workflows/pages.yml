name: GitHub Pages
on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/build-site.py', 'scripts/build-help.py', 'Sources/TurtleGitMac/Resources/TurtleGitHelp.help/**', 'scripts/site_docs.py', 'scripts/site-requirements.txt', 'scripts/test-site-docs.py', 'scripts/test-site-search.cjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install documentation renderer
        run: python3 -m pip install -r scripts/site-requirements.txt
      - name: Check bundled Mac help sources
        run: python3 scripts/build-help.py --check
      - name: Build static project site
        run: python3 scripts/build-site.py
      - name: Check generated documentation links
        run: python3 scripts/test-site-docs.py
      - name: Check local search behavior
        run: node scripts/test-site-search.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
